name: Main
run-name: Build & deploy 🚀
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_NAME: copenhagen
  INPUT_BUCKET_NAME: molnarbence-prod-copenhagen-input

permissions:
  id-token: write # REQUIRED for OIDC
  contents: read

jobs:
  prepare:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      project_name: ${{ steps.vars.outputs.project_name }}
      input_bucket_name: ${{ steps.vars.outputs.input_bucket_name }}
    steps:
      - id: vars
        run: |
          echo "project_name=${{ env.PROJECT_NAME }}" >> "$GITHUB_OUTPUT"
          echo "input_bucket_name=${{ env.INPUT_BUCKET_NAME }}" >> "$GITHUB_OUTPUT"

  sonarqube:
    name: SonarQube
    uses: mb-dot-dev/reusable-workflows/.github/workflows/python-test-sonar.yaml@main
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-lambda-zip:
    name: Build Lambda ZIP
    needs:
      - sonarqube
    uses: mb-dot-dev/reusable-workflows/.github/workflows/build-lambda-zip.yaml@main

  cfn-lint:
    name: CloudFormation Lint
    uses: mb-dot-dev/reusable-workflows/.github/workflows/cfn-lint.yaml@main

  deploy-resource-group:
    name: Deploy Resource Group
    needs:
      - prepare
      - cfn-lint
    uses: mb-dot-dev/reusable-workflows/.github/workflows/deploy-cloudformation.yaml@main
    secrets: inherit
    with:
      stack-name: ${{ needs.prepare.outputs.project_name }}-resource-group
      template: aws/resource-group.yml
      project: ${{ needs.prepare.outputs.project_name }}
      parameter-overrides: >-
        ProjectName=${{ needs.prepare.outputs.project_name }}

  deploy-sqs:
    name: Deploy SQS Queue
    needs:
      - prepare
      - cfn-lint
    uses: mb-dot-dev/reusable-workflows/.github/workflows/deploy-cloudformation.yaml@main
    secrets: inherit
    with:
      stack-name: ${{ needs.prepare.outputs.project_name }}-sqs
      template: aws/sqs.yml
      project: ${{ needs.prepare.outputs.project_name }}
      parameter-overrides: >-
        ProjectName=${{ needs.prepare.outputs.project_name }},
        QueueName=${{ needs.prepare.outputs.project_name }}-s3-events,
        BucketName=${{ needs.prepare.outputs.input_bucket_name }}

  deploy-s3:
    name: Deploy S3 Bucket
    needs:
      - prepare
      - deploy-sqs
    uses: mb-dot-dev/reusable-workflows/.github/workflows/deploy-cloudformation.yaml@main
    secrets: inherit
    with:
      stack-name: ${{ needs.prepare.outputs.project_name }}-input-bucket
      template: aws/s3.yml
      project: ${{ needs.prepare.outputs.project_name }}
      parameter-overrides: >-
        ProjectName=${{ needs.prepare.outputs.project_name }},
        BucketName=${{ needs.prepare.outputs.input_bucket_name }},
        QueueArn=${{ fromJSON(needs.deploy-sqs.outputs.stack-outputs-json).QueueArn }}

  deploy-iam-role:
    name: Deploy IAM Role
    needs:
      - prepare
      - deploy-sqs
    uses: mb-dot-dev/reusable-workflows/.github/workflows/deploy-cloudformation.yaml@main
    secrets: inherit
    with:
      stack-name: ${{ needs.prepare.outputs.project_name }}-lambda-role
      template: aws/lambda-role.yml
      project: ${{ needs.prepare.outputs.project_name }}
      parameter-overrides: >-
        ProjectName=${{ needs.prepare.outputs.project_name }},
        RoleName=${{ needs.prepare.outputs.project_name }}-lambda,
        QueueArn=${{ fromJSON(needs.deploy-sqs.outputs.stack-outputs-json).QueueArn }}
  
  deploy-s3-bucket-policy:
    name: Deploy S3 Bucket Policy
    needs:
      - prepare
      - deploy-s3
      - deploy-iam-role
    uses: mb-dot-dev/reusable-workflows/.github/workflows/deploy-cloudformation.yaml@main
    secrets: inherit
    with:
      stack-name: ${{ needs.prepare.outputs.project_name }}-input-bucket-policy
      template: aws/s3-bucket-policy.yml
      project: ${{ needs.prepare.outputs.project_name }}
      parameter-overrides: >-
        BucketName=${{ needs.prepare.outputs.input_bucket_name }},
        BucketArn=${{ fromJSON(needs.deploy-s3.outputs.stack-outputs-json).BucketArn }},
        LambdaExecutionRoleArn=${{ fromJSON(needs.deploy-iam-role.outputs.stack-outputs-json).LambdaExecutionRoleArn }}

  deploy-lambda:
    name: Deploy Lambda
    needs:
      - prepare
      - cfn-lint
      - build-lambda-zip
      - deploy-sqs
      - deploy-iam-role
    uses: mb-dot-dev/reusable-workflows/.github/workflows/deploy-lambda.yaml@main
    with:
      project: ${{ needs.prepare.outputs.project_name }}
      lambda-execution-role-arn: ${{ fromJSON(needs.deploy-iam-role.outputs.stack-outputs-json).LambdaExecutionRoleArn }}
      parameter-overrides: QueueArn=${{ fromJSON(needs.deploy-sqs.outputs.stack-outputs-json).QueueArn }}
    secrets:
      DEPLOY_ROLE_ARN: ${{ secrets.DEPLOY_ROLE_ARN }}
